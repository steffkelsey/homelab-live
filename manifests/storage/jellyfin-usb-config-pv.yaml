apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-usb-config-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  local:
    path: "/mnt/usb/config"
  storageClassName: local-storage
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: jellyfin
              operator: In
              values:
                - enabled
