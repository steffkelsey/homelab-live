apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-usb-data-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  local:
    path: "/mnt/usb/data"
  storageClassName: local-storage
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: jellyfin
              operator: In
              values:
                - enabled
